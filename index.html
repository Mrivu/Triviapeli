<html>
    <head>
        <title>Trivial pursuit peli</title>
        <link rel="stylesheet" href="styles.css">
        <script src="game.js" defer></script>
    </head>
    <body>
        <header class="game-header">
            <h1>Trivia peli</h1>
            <p>Kerää kaikki kategoriat</p>
        </header>

        <section class="status-panel">
            <article class="player-card">
                <h2>Pelaaja</h2>
                <img src="pelaaja.jpg" class="player-image">
                <p>Kerätyt aihealueet: 0/6</p>
                
                <section id="question-panel" class="question-panel" hidden>
                    <p id="question-category">Tähän tulee categoria</p>
                    <h2 id="question-text">Tähän tulee kysymys</h2>
                    <div id="question-answers" class="question-answers"></div>
                    <p id="feedback">Tähän tulee palaute</p>
                </section>

            </article>

            <article class="dice-panel">
                <p>Vuorossa:</p>
                <h2>Pelaaja</h2>
                <button id="roll-button">Heitä noppaa</button>
                <div id="dice-box" class="dice-box">3</div>

                <div id="board" class="board">Tähän tulee pelilauta</div>
            </article>

            <article class="player-card">
                <h2>Tietokone</h2>
                <img src="tietokone.jpg" class="player-image">
                <p>Kerätyt aihealueet: 0/6</p>
            </article>
        </section>
    </body>
</html>
